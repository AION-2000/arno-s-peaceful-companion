
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arno's Safe Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.8s ease, color 0.8s ease;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
    }

    .dark .gradient-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      background-size: 400% 400%;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .soft-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    /* Custom Soothing Animations */
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    .animate-float-delayed {
      animation: float 8s ease-in-out infinite;
      animation-delay: 2s;
    }

    .animate-breathe-slow {
      animation: breathe 10s ease-in-out infinite;
    }

    .animate-spin-slow {
      animation: spin 12s linear infinite;
    }

    .tab-content-enter {
      animation: tabEnter 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes tabEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Ensure all elements transition smoothly */
    * {
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "d3": "https://esm.sh/d3@^7.9.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="gradient-bg min-h-screen relative">
  <!-- Soft Floating Blobs for Atmosphere -->
  <div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-rose-100/30 dark:bg-rose-900/10 rounded-full blur-[100px] animate-breathe-slow pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-blue-100/30 dark:bg-indigo-900/10 rounded-full blur-[100px] animate-breathe-slow pointer-events-none z-0" style="animation-delay: -5s;"></div>
  
  <div id="root" class="relative z-10"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
